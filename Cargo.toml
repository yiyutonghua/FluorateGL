[package]
name = "FluorateGL"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
name = "fluorategl"

[[example]]
name = "glslang_suite"
path = "tests/glsl/glslang_suite.rs"

[[example]]
name = "translate_test"
path = "tests/glsl/translate_test.rs"

[dependencies]
bytemuck = { version = "1", default-features = false }
ctor = "1.0.9"
glslang = "0.8.1"
glslang-sys = "0.8.1"
libc = "0.2.186"
log = "0.4.33"
regex = "1"
spirv-cross2 = { version = "0.7.1", default-features = false, features = ["glsl","cpp"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 8

[profile.dev]
opt-level = 0
lto = false
strip = false
codegen-units = 8

[features]
default = []
build-from-source = []

[[example]]
name = "test_preprocess"
path = "tests/glsl/test_preprocess.rs"
