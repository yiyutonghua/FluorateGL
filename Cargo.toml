[package]
name = "FluorateGL"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
name = "fluorategl"

[dependencies]
ctor = "1.0.9"
libc = "0.2.186"
log = "0.4.33"
lru = "0.12"
regex = "1"
rustc-hash = "2.1.3"
sha2 = "0.10"
shaderc = { version = "0.10.1", features = ["build-from-source"] }
spirv-cross2 = { version = "0.7.1", default-features = false, features = ["glsl","cpp"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 8

[profile.dev]
opt-level = 0
lto = false
strip = false
codegen-units = 8

[[example]]
name = "test_preprocess"
path = "tests/glsl/test_preprocess.rs"

[[example]]
name = "glslang_suite"
path = "tests/glsl/glslang_suite.rs"

[[example]]
name = "translate_test"
path = "tests/glsl/translate_test.rs"
