name: Host Tests (x86_64)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  host-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl-dev libgles2-mesa-dev libgles2 libegl1 \
            cmake ninja-build python3 g++ pkg-config

      - name: Setup Rust (x86_64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: host-x86_64

      # 首次构建含 shaderc build-from-source（vendored SPIRV-Tools 等，数分钟）
      - name: Build (x86_64 host)
        run: cargo build --target x86_64-unknown-linux-gnu

      - name: Cargo test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}
          EGL_PLATFORM: surfaceless
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: cargo test --target x86_64-unknown-linux-gnu

      # 差分测试（desktop/gles/translate 三端对比；run.sh 自动建 libGLESv3.so 软链）
      - name: Differential tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: bash tests/run.sh --only-diff
